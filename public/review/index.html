<html lang="en"><head>

<title>Prospect worklist</title>
<style>
  /* Light is the complete palette; dark redefines only tokens. Neutrals carry a
     green-cool bias so they read as chosen rather than default grey. */
  :root{
    --ground:#f5f8f7; --panel:#ffffff; --line:#dde5e3; --line-soft:#eaf0ef;
    --ink:#0d1a19; --ink-2:#3d5250; --muted:#6b807e;
    --accent:#0a7a72; --accent-ink:#ffffff; --accent-soft:#0a7a721a;
    --dead:#bf3b2e; --nosite:#a86a09; --ok:#5a7573;
    --shadow:0 1px 2px rgba(13,26,25,.05),0 8px 24px -16px rgba(13,26,25,.18);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --ground:#0b1413; --panel:#121e1d; --line:#22322f; --line-soft:#1a2726;
      --ink:#e2ecea; --ink-2:#a9bfbc; --muted:#7f9694;
      --accent:#3fbfb4; --accent-ink:#06201e; --accent-soft:#3fbfb422;
      --dead:#f2705f; --nosite:#e0a13c; --ok:#7f9694;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.7);
    }
  }
  :root[data-theme="dark"]{
    --ground:#0b1413; --panel:#121e1d; --line:#22322f; --line-soft:#1a2726;
    --ink:#e2ecea; --ink-2:#a9bfbc; --muted:#7f9694;
    --accent:#3fbfb4; --accent-ink:#06201e; --accent-soft:#3fbfb422;
    --dead:#f2705f; --nosite:#e0a13c; --ok:#7f9694;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.7);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);
    font:15px/1.5 system-ui,-apple-system,"Segoe UI Variable Text","Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased}
  .mono{font-family:"Cascadia Code",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-variant-numeric:tabular-nums}
  .wrap{max-width:1080px;margin:0 auto;padding:34px 20px 80px}
  header h1{font-size:clamp(21px,3vw,27px);font-weight:800;letter-spacing:-.022em;margin:0 0 4px;text-wrap:balance}
  header p{margin:0;color:var(--muted);font-size:13.5px}
  .figs{display:flex;flex-wrap:wrap;margin:26px 0 22px;border:1px solid var(--line);
    border-radius:12px;background:var(--panel);box-shadow:var(--shadow);overflow:hidden}
  .fig{flex:1 1 130px;padding:14px 16px;border-right:1px solid var(--line-soft)}
  .fig:last-child{border-right:0}
  .fig b{display:block;font-size:23px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
  .fig span{display:block;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin-top:3px}
  .fig.dead b{color:var(--dead)} .fig.nosite b{color:var(--nosite)}
  .controls{position:sticky;top:0;z-index:5;background:var(--ground);padding:10px 0 12px;
    display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line)}
  input[type=search],select{font:inherit;font-size:13.5px;padding:7px 11px;
    border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
  input[type=search]{flex:1 1 210px;min-width:0}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .chip{font:inherit;font-size:12.5px;padding:6px 12px;border:1px solid var(--line);
    border-radius:999px;background:var(--panel);color:var(--ink-2);cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .count{margin-left:auto;font-size:12.5px;color:var(--muted)}
  ul{list-style:none;margin:0;padding:0}
  li.row{display:grid;grid-template-columns:5px 62px minmax(0,1fr) auto;gap:0 14px;
    align-items:center;background:var(--panel);border:1px solid var(--line);border-top:0;padding-right:16px}
  li.row:first-of-type{border-top:1px solid var(--line);border-radius:12px 12px 0 0}
  li.row:last-of-type{border-radius:0 0 12px 12px}
  li.row:hover{background:var(--accent-soft)}
  .stripe{align-self:stretch;background:var(--ok)}
  .row.dead .stripe{background:var(--dead)}
  .row.nosite .stripe{background:var(--nosite)}
  .score{padding:13px 0 13px 12px;font-size:17px;font-weight:700;letter-spacing:-.02em}
  .tier{display:block;font-size:9.5px;letter-spacing:.1em;color:var(--muted);font-weight:600}
  .main{padding:12px 0;min-width:0}
  .biz{font-weight:650;letter-spacing:-.01em}
  .biz a{color:inherit;text-decoration:none}
  .biz a:hover{text-decoration:underline;text-underline-offset:2px}
  .meta{font-size:12.5px;color:var(--muted);margin-top:1px}
  .defect{font-size:13px;margin-top:5px;display:inline-flex;align-items:center;gap:7px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ok);flex:none}
  .row.dead .dot{background:var(--dead)} .row.nosite .dot{background:var(--nosite)}
  .contact{font-size:12.5px;color:var(--ink-2);margin-top:4px}
  .contact a{color:var(--ink-2);text-decoration:none}
  .contact a:hover{color:var(--accent)}
  .sep{color:var(--line)}
  .acts{display:flex;gap:6px;padding:12px 0}
  .btn{font:inherit;font-size:12.5px;padding:6px 11px;border-radius:8px;cursor:pointer;
    border:1px solid var(--line);background:transparent;color:var(--ink-2);text-decoration:none;
    white-space:nowrap;display:inline-flex;align-items:center}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.solid{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
  .empty{padding:44px;text-align:center;color:var(--muted);border:1px dashed var(--line);
    border-radius:12px;background:var(--panel)}
  footer{margin-top:26px;font-size:12px;color:var(--muted);line-height:1.7}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  @media (max-width:640px){
    li.row{grid-template-columns:5px 54px minmax(0,1fr);padding-right:12px}
    .acts{grid-column:2 / -1;padding:0 0 12px}
  }
</style></head><body>

const { summary, leads } = DATA;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

$('#figs').innerHTML = [
  ['', summary.total, 'published'],
  ['nosite', summary.noSite, 'no website'],
  ['dead', summary.dead, 'dead domain'],
  ['', summary.callable, 'callable'],
  ['', summary.emailable, 'have email'],
].map(([cls, n, label]) => '<div class="fig ' + cls + '"><b class="mono">' + n + '</b><span>' + label + '</span></div>').join('');

for (const c of summary.categories) $('#cat').insertAdjacentHTML('beforeend', '<option>' + esc(c) + '</option>');

let state = 'all';
function render() {
  const q = $('#q').value.trim().toLowerCase();
  const cat = $('#cat').value;
  const rows = leads.filter(l => {
    if (state !== 'all' && (l.state === 'no-site' ? 'nosite' : l.state) !== state) return false;
    if (cat && l.category !== cat) return false;
    if (!q) return true;
    return [l.name, l.category, l.headline, l.phone, l.email].filter(Boolean).join(' ').toLowerCase().includes(q);
  });
  $('#count').textContent = rows.length + (rows.length === 1 ? ' business' : ' businesses');
  if (!rows.length) { $('#list').innerHTML = '<div class="empty">Nothing matches that filter.</div>'; return; }
  $('#list').innerHTML = rows.map(l => {
    const cls = l.state === 'dead' ? 'dead' : l.state === 'no-site' ? 'nosite' : '';
    const wa = l.whatsapp || l.phone;
    const contacts = [
      l.phone ? '<a href="tel:' + esc(l.phone) + '">' + esc(l.phone) + '</a>' : null,
      l.email ? '<a href="mailto:' + esc(l.email) + '">' + esc(l.email) + '</a>' : null,
      l.reviews ? esc(l.rating ? l.rating + '\u2605 (' + l.reviews + ')' : l.reviews + ' reviews') : null,
    ].filter(Boolean).join(' <span class="sep">|</span> ');
    return '<li class="row ' + cls + '">' +
      '<div class="stripe"></div>' +
      '<div class="score mono">' + (l.score ?? '\u2014') + '<span class="tier">TIER ' + (l.tier ?? '?') + '</span></div>' +
      '<div class="main">' +
        '<div class="biz"><a href="' + esc(l.url) + '" target="_blank" rel="noreferrer">' + esc(l.name) + '</a></div>' +
        '<div class="meta">' + [l.category, l.city].filter(Boolean).map(esc).join(' \u00b7 ') + '</div>' +
        (l.headline ? '<div class="defect"><span class="dot"></span>' + esc(l.headline) + '</div>' : '') +
        (contacts ? '<div class="contact mono">' + contacts + '</div>' : '') +
      '</div>' +
      '<div class="acts">' +
        '<a class="btn solid" href="' + esc(l.url) + '" target="_blank" rel="noreferrer">Report</a>' +
        (wa ? '<a class="btn" href="https://wa.me/' + esc(String(wa).replace(/\D/g, '')) + '" target="_blank" rel="noreferrer">WhatsApp</a>' : '') +
        '<button class="btn" data-copy="' + esc(l.url) + '">Copy link</button>' +
      '</div></li>';
  }).join('');
}
document.addEventListener('click', (e) => {
  const chip = e.target.closest('.chip[data-state]');
  if (chip) {
    state = chip.dataset.state;
    document.querySelectorAll('.chip[data-state]').forEach(c => c.setAttribute('aria-pressed', String(c === chip)));
    render(); return;
  }
  const cp = e.target.closest('[data-copy]');
  if (cp) {
    navigator.clipboard.writeText(cp.dataset.copy);
    const t = cp.textContent; cp.textContent = 'Copied';
    setTimeout(() => { cp.textContent = t; }, 1100);
  }
});
$('#q').addEventListener('input', render);
$('#cat').addEventListener('change', render);
render();
